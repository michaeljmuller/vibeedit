name: vibeedit

# VibeEdit: Express server + React client in one container.
# Built on the server via `git pull` (no registry); runs identically under
# docker/arm64 (dev) and podman/amd64 (prod). Caddy fronts the app on the host.
services:
  app:
    build:
      # Context is the repository root, not the component dir: the image stamps
      # the running commit into /app/VERSION, so .git has to be reachable.
      context: ../..
      dockerfile: src/docker/web/Dockerfile
    ports:
      # Host port 3000 -> edit.themullers.org (see ports registry).
      - "3000:3000"
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      # Runtime rather than build args, so the keys never land in image layers.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:?set ELEVENLABS_API_KEY in .env}
      # Text to speech. The default voice is "Lourenço" (European Portuguese); any
      # voice ID from the ElevenLabs library works.
      TTS_VOICE_ID: ${TTS_VOICE_ID:-Fij0Q07RV232HQv4oaiV}
      TTS_MODEL: ${TTS_MODEL:-eleven_multilingual_v2}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/auth/google/callback}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      # Bypasses Google and signs everyone in as this address. Never set in prod.
      _SINGLE_USER_EMAIL: ${_SINGLE_USER_EMAIL:-}
      DICT_DIR: /data
      # The companion container below. Not a secret and not in .env: it only
      # changes if the service is renamed.
      CONJUGATION_URL: http://conjugation:8000
    depends_on:
      conjugation:
        condition: service_healthy
    volumes:
      # Both read-only: the app never writes to them. The dictionaries are
      # copied from a Mac (util/setup-dictionaries.sh) and are not redistributable,
      # so they are mounted rather than built into the image.
      - ../../config/allowed-emails.txt:/config/allowed-emails.txt:ro
      - ../../data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Verb conjugation lookup: the conjugate-api library behind its HTTP wrapper.
  # The library is Python and this app is Node, so it runs beside the app rather
  # than inside its image (the library's docs/design.txt has the reasoning).
  # It belongs to this stack only: no host port, no sign-in, no state.
  conjugation:
    build:
      context: ./conjugation
      args:
        # The library's commit, set by update.sh so that a new one rebuilds the
        # image. Unset, the head of main is used and the cached layer is reused.
        LIB_REV: ${LIB_REV:-main}
    restart: ${RESTART_POLICY:-unless-stopped}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 5
